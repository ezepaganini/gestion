<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa de proveedores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8edf1;--dot:#c3ced8;--panel:#fff;--ink:#17232e;--mute:#5f6e7b;--line:#d3dbe1;--acc:#2f5d8a;--sh:0 10px 24px -12px #17232e77}
@media(prefers-color-scheme:dark){:root{--bg:#10171d;--dot:#26343f;--panel:#1a242d;--ink:#e6ecf0;--mute:#93a3b0;--line:#33424e;--acc:#6fa3d4;--sh:0 10px 24px -12px #000}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:400 15px/1.4 "Schibsted Grotesk",system-ui,sans-serif}
button,input{font:inherit;color:inherit}
#board{position:fixed;inset:0;touch-action:none;cursor:grab;background-image:radial-gradient(var(--dot) 1.6px,transparent 1.7px);background-size:28px 28px}
#board.pan{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#lines{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#lines path{fill:none;stroke:var(--acc);stroke-width:2.8;stroke-linecap:round;opacity:.65}
.n{position:absolute;cursor:move;transform-origin:0 0}
.rs{position:absolute;right:-9px;bottom:-9px;width:22px;height:22px;border-radius:50%;background:var(--acc);border:3px solid var(--panel);cursor:nwse-resize;display:none;z-index:6;transform:scale(calc(1/var(--s,1)))}
.n:hover .rs,.n.sel .rs{display:block}
.n.link{width:250px;background:var(--panel);border:3px solid var(--c);border-radius:26px;padding:8px;box-shadow:var(--sh)}
.n.d{opacity:.45;filter:grayscale(.7)}
.hide-d .n.d{display:none}
.img{position:relative;display:block;aspect-ratio:16/10;background:var(--line);border-radius:18px;overflow:hidden}
.img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;pointer-events:none}
.ph{position:absolute;inset:0;display:grid;place-items:center;font-size:42px;font-weight:800;color:var(--mute)}
.b{padding:9px 6px 3px;display:grid;gap:5px}
.r1{display:flex;justify-content:space-between;align-items:center}
.chip{border:0;background:var(--c);color:#fff;border-radius:999px;padding:2px 12px;font-size:12.5px;font-weight:700;cursor:pointer}
.stars{display:flex}
.stars button{border:0;background:none;color:var(--line);font-size:19px;padding:0 1px;cursor:pointer;line-height:1}
.stars .on{color:#e3a400}
.nm{font-weight:800;font-size:16.5px;line-height:1.2}
.host{font-size:12.5px;color:var(--mute)}
.tx{white-space:pre-wrap;overflow-wrap:anywhere;outline:none;min-height:1.3em;cursor:text;border-radius:8px}
.tx:empty::before{content:attr(data-ph);color:var(--mute);opacity:.75}
.tx:focus{background:#00000012}
.n.note,.n.msg{width:210px;background:var(--bg);color:#2b2a1d;border-radius:8px 8px 30px 8px;padding:14px 17px 18px;box-shadow:0 14px 16px -12px #000b;transform:rotate(-1.2deg)}
.n.msg{transform:rotate(1deg)}
.n.note .tx:empty::before,.n.msg .tx:empty::before{color:#2b2a1d}
.nt{font-weight:800;font-size:12.5px;margin-bottom:4px}
.n.tema{background:var(--bg);color:#fff;border-radius:999px;padding:14px 28px;min-width:130px;font-size:19px;font-weight:800;text-align:center;box-shadow:var(--sh)}
.n.tema .tx:empty::before{color:#fff}
.tools{position:absolute;left:0;right:0;top:100%;padding-top:7px;display:none;gap:5px;justify-content:center;flex-wrap:wrap;z-index:5;transform:scale(calc(1/var(--s,1)));transform-origin:50% 0}
.n:hover .tools,.n.sel .tools,.n:focus-within .tools{display:flex}
.tools button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:3px 12px;font-size:12.5px;cursor:pointer;box-shadow:var(--sh)}
.connecting .n{cursor:crosshair}
.n.src{outline:3px dashed var(--acc);outline-offset:5px}
.bar{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:50;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:calc(100vw - 20px);padding:8px;background:var(--panel);border-radius:30px;box-shadow:var(--sh)}
.bar input{width:min(330px,70vw);border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 16px}
.bar button{border:1px solid var(--line);background:none;border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:500}
.bar button:hover,.tools button:hover{border-color:var(--acc)}
.bar button.warn{border-color:#e3a400}
.bar button.ok{border-color:#2a8650;color:#2a8650}
.bar button.on{background:var(--acc);border-color:var(--acc);color:#fff}
#hint{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:50;max-width:min(560px,92vw);text-align:center;background:var(--panel);border-radius:999px;padding:9px 20px;box-shadow:var(--sh);color:var(--mute);font-size:14px}
#hint[hidden]{display:none}
:is(button,input):focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.corner{position:fixed;left:12px;bottom:12px;z-index:50;display:flex;flex-direction:column;gap:6px}
.corner button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--mute);display:grid;place-items:center;cursor:pointer;box-shadow:var(--sh);opacity:.75}
.corner button:hover{opacity:1;color:var(--ink);border-color:var(--acc)}
</style>
</head>
<body>
<div class="bar">
  <input id="u" placeholder="Pegá el link de un proveedor y Enter" aria-label="Link del proveedor">
  <button id="bt">+ Tema</button>
  <button id="bn">+ Nota</button>
  <button id="bm">+ Mensaje a proveedor</button>
  <button id="zo" aria-label="Alejar">−</button>
  <button id="zi" aria-label="Acercar">+</button>
  <button id="fit">Ver todo</button>
  <button id="hd">Ocultar descartados</button>
  <button id="sh" class="warn">Solo en este navegador</button>
</div>
<div id="board"><div id="world"></div></div>
<div class="corner">
  <button id="ex" title="Descargar copia" aria-label="Descargar copia"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M7 11l5 5 5-5"/><path d="M5 20h14"/></svg></button>
  <button id="im" title="Restaurar copia" aria-label="Restaurar copia"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V5"/><path d="M7 9l5-5 5 5"/><path d="M5 20h14"/></svg></button>
  <input type="file" id="file" accept=".json" hidden>
</div>
<div id="hint" hidden></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='mapa-proveedores-v1';
const DB_URL='https://marca-b8f78-default-rtdb.firebaseio.com'; // URL de tu Firebase Realtime Database: si la pegás acá, todos los que abran la página comparten el mapa sin configurar nada
let base=DB_URL;
if(!base){try{base=localStorage.getItem('mapa-db')||''}catch(e){}}
base=base.trim().replace(/\/+$/,'');
const EST=[['ver','Por ver','#6b7b89'],['gusta','Me gusta','#2a8650'],['contactado','Contactado','#2f6fb0'],['descartado','Descartado','#b4483f']];
const PAL=['#fff0a0','#ffc6d9','#bfe1ff','#c6efc3'],PALT=['#2f5d8a','#8a5fb8','#2a8650','#b5780b','#b4483f'];
let D=null;
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.nodes)D=s}catch(e){}
if(!D)D={nodes:[{id:1,t:'tema',x:-70,y:-30,z:1,c:0,txt:'Mi marca'}],links:[],V:{x:innerWidth/2,y:innerHeight/2,z:1}};
let els={},zt=10,conn=null,selId=null,jd=false,tm;
let pend=0,synced=new Set();const tms={};
try{if(base&&localStorage.getItem('mapa-synced')===base)synced=new Set(D.nodes.map(n=>n.id))}catch(e){}
const N=id=>D.nodes.find(n=>n.id===id);
const save=()=>{clearTimeout(tm);tm=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}},300)};
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return u}};
const fix=u=>/^https?:\/\//i.test(u.trim())?u.trim():'https://'+u.trim();

function applyView(){
  const V=D.V,b=$('#board').style;
  $('#world').style.transform=`translate(${V.x}px,${V.y}px) scale(${V.z})`;
  b.backgroundSize=`${28*V.z}px ${28*V.z}px`;b.backgroundPosition=`${V.x}px ${V.y}px`;
}
function zoomAt(mx,my,f){const V=D.V,z=Math.min(2,Math.max(.25,V.z*f));V.x=mx-(mx-V.x)*(z/V.z);V.y=my-(my-V.y)*(z/V.z);V.z=z;applyView();save()}

function scl(n,el){const r=n.t==='note'?-1.2:n.t==='msg'?1:0,s=n.s||1;el.style.transform=`rotate(${r}deg) scale(${s})`;el.style.setProperty('--s',s)}
function mk(n){
  const el=document.createElement('div');
  el.className='n '+(n.t==='link'?'link':n.t);el.dataset.id=n.id;
  el.style.left=n.x+'px';el.style.top=n.y+'px';el.style.zIndex=n.z||1;scl(n,el);
  if(n.id===selId)el.classList.add('sel');
  if(n.id===conn)el.classList.add('src');
  const ed=(f,ph,cls='tx')=>`<div class="${cls}" contenteditable="plaintext-only" spellcheck="false" data-f="${f}" data-ph="${ph}">${esc(n[f])}</div>`;
  const tools=x=>`<div class="tools"><button data-a="conn">Unir</button>${x||''}<button data-a="del" aria-label="Borrar">✕</button></div>`;
  if(n.t==='link'){
    const e=EST.find(x=>x[0]===n.estado)||EST[0];
    el.style.setProperty('--c',e[2]);if(n.estado==='descartado')el.classList.add('d');
    const src=n.img||'https://image.thum.io/get/width/500/crop/320/'+n.url;
    el.innerHTML=`<a class="img" href="${esc(n.url)}" target="_blank" rel="noopener"><span class="ph">${esc((n.nombre||'?')[0].toUpperCase())}</span><img loading="lazy" referrerpolicy="no-referrer" alt="" src="${esc(src)}" onerror="this.remove()" onload="drawLines()"></a>
    <div class="b"><div class="r1"><button class="chip" data-a="est">${e[1]}</button><span class="stars">${[1,2,3,4,5].map(i=>`<button class="${i<=n.rating?'on':''}" data-s="${i}" aria-label="${i} de 5">★</button>`).join('')}</span></div>
    ${ed('nombre','Nombre','tx nm')}<div class="host">${esc(host(n.url))}</div>${ed('txt','Qué ofrece, precios, mínimo…')}</div>${tools()}`;
  }else if(n.t==='tema'){
    el.style.setProperty('--bg',PALT[(n.c||0)%PALT.length]);
    el.innerHTML=ed('txt','Tema')+tools('<button data-a="col">Color</button>');
  }else{
    el.style.setProperty('--bg',PAL[(n.c||0)%PAL.length]);
    el.innerHTML=(n.t==='msg'?'<div class="nt">Mensaje para proveedor</div>':'')+ed('txt','Escribí acá…')+tools('<button data-a="col">Color</button>'+(n.t==='msg'?'<button data-a="copy">Copiar</button>':''));
  }
  el.insertAdjacentHTML('beforeend','<div class="rs" title="Arrastrá para cambiar el tamaño (doble clic: tamaño normal)"></div>');
  return el;
}
function swap(n){const o=els[n.id],el=mk(n);o.replaceWith(el);els[n.id]=el;drawLines();save()}
function drawLines(){
  const L=$('#lines');if(!L)return;
  L.innerHTML=D.links.map(([a,b])=>{
    const A=N(a),B=N(b),ea=els[a],eb=els[b];
    if(!A||!B||!ea||!eb||!ea.offsetWidth||!eb.offsetWidth)return'';
    const sa=A.s||1,sb=B.s||1,x1=A.x+ea.offsetWidth*sa/2,y1=A.y+ea.offsetHeight*sa/2,x2=B.x+eb.offsetWidth*sb/2,y2=B.y+eb.offsetHeight*sb/2,dx=(x2-x1)/2;
    return `<path d="M${x1} ${y1}C${x1+dx} ${y1} ${x2-dx} ${y2} ${x2} ${y2}"/>`;
  }).join('');
}
function hint(){
  const h=$('#hint');
  if(conn!==null){h.textContent='Tocá el elemento que querés unir con este. Si ya están unidos, se separan. Esc cancela.';h.hidden=false}
  else if(D.nodes.length<=1){h.textContent='Pegá el link de un proveedor arriba y Enter. Arrastrá para moverlo y usá “Unir” para conectar ideas.';h.hidden=false}
  else h.hidden=true;
}
function render(){
  const w=$('#world');w.innerHTML='<svg id="lines"></svg>';els={};
  D.nodes.forEach(n=>{els[n.id]=mk(n);w.append(els[n.id])});
  applyView();drawLines();hint();
}
function select(id){selId=id;for(const k in els)els[k].classList.toggle('sel',+k===id)}
function setConn(id){
  conn=id;$('#board').classList.toggle('connecting',id!==null);
  for(const k in els)els[k].classList.toggle('src',+k===id);hint();
}
function add(n){
  const V=D.V;
  n.id=Date.now()+Math.floor(Math.random()*1000);
  n.x=Math.round((innerWidth/2-V.x)/V.z-110+(Math.random()-.5)*140);
  n.y=Math.round((innerHeight/2-V.y)/V.z-60+(Math.random()-.5)*140);
  n.z=++zt;D.nodes.push(n);els[n.id]=mk(n);$('#world').append(els[n.id]);save();qn(n);hint();return n;
}
async function addLink(raw){
  const url=fix(raw);
  const n=add({t:'link',url,nombre:host(url),img:'',estado:'ver',rating:0,txt:''});
  try{
    const j=await(await fetch('https://api.microlink.io/?url='+encodeURIComponent(url))).json(),d=j.data||{};
    if(j.status==='success'){n.nombre=(d.publisher||d.title||n.nombre).slice(0,60);n.img=(d.image&&d.image.url)||(d.logo&&d.logo.url)||'';if(els[n.id])swap(n);qn(n)}
  }catch(e){}
}
function fit(){
  if(!D.nodes.length)return;
  let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;
  D.nodes.forEach(n=>{const e=els[n.id];if(!e.offsetWidth)return;x1=Math.min(x1,n.x);y1=Math.min(y1,n.y);x2=Math.max(x2,n.x+e.offsetWidth*(n.s||1));y2=Math.max(y2,n.y+e.offsetHeight*(n.s||1))});
  if(x1>x2)return;
  const z=Math.min(1.2,Math.max(.25,Math.min((innerWidth-80)/(x2-x1),(innerHeight-200)/(y2-y1))));
  D.V={z,x:(innerWidth-(x2-x1)*z)/2-x1*z,y:(innerHeight-(y2-y1)*z)/2-y1*z+40};applyView();save();
}

function setSt(ok){
  const b=$('#sh');
  if(!base){b.textContent='Solo en este navegador';b.className='warn';return}
  b.textContent=ok===false?'Sin conexión con la nube':'Compartido';b.className=ok===false?'warn':'ok';
}
function W(path,body){
  if(!base)return;pend++;
  return fetch(base+'/mapa/'+path+'.json',{method:body===undefined?'DELETE':'PUT',headers:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)})
    .then(r=>{if(!r.ok)throw 0;setSt(true)}).catch(()=>setSt(false)).finally(()=>{pend--});
}
function qn(n){
  if(!base)return;
  if(!tms[n.id])pend++;
  clearTimeout(tms[n.id]);
  tms[n.id]=setTimeout(()=>{delete tms[n.id];pend--;synced.add(n.id);W('nodos/n'+n.id,n)},500);
}
const lk=l=>'links/l'+l[0]+'_'+l[1];
const pl=l=>W(lk(l),l),dl=l=>W(lk(l));
const sig=n=>JSON.stringify(Object.keys(n).sort().map(k=>[k,n[k]]));
function apply(j){
  const rn=Object.values((j&&j.nodos)||{}),rl=Object.values((j&&j.links)||{}),rid=new Set(rn.map(n=>n.id));
  D.nodes=D.nodes.filter(n=>{
    if(rid.has(n.id)||!synced.has(n.id))return true;
    if(els[n.id])els[n.id].remove();delete els[n.id];return false;
  });
  rn.forEach(r=>{
    synced.add(r.id);const l=N(r.id);
    if(!l){D.nodes.push(r);els[r.id]=mk(r);$('#world').append(els[r.id]);zt=Math.max(zt,r.z||0)}
    else if(sig(l)!==sig(r)){Object.assign(l,r);swap(l)}
  });
  D.nodes.forEach(n=>{if(!rid.has(n.id))qn(n)});
  const rk=new Set(rl.map(l=>l[0]+'_'+l[1]));
  const keep=D.links.filter(l=>!rk.has(l[0]+'_'+l[1])&&!(synced.has(l[0])&&synced.has(l[1])));
  keep.forEach(pl);
  D.links=rl.filter(l=>N(l[0])&&N(l[1])).concat(keep);
  drawLines();hint();save();
  try{localStorage.setItem('mapa-synced',base)}catch(e){}
}
async function refresh(){
  if(!base||pend>0||drag||document.hidden)return;
  const ae=document.activeElement;if(ae&&ae.isContentEditable)return;
  try{
    const r=await fetch(base+'/mapa.json?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw 0;
    const j=await r.json();
    if(pend>0||drag)return;
    apply(j);setSt(true);
  }catch(e){setSt(false)}
}
$('#sh').onclick=()=>{
  if(DB_URL){alert('La base de datos ya está fijada en el código de la página.');return}
  const u=prompt('Pegá la URL de tu Firebase Realtime Database (ej: https://tu-proyecto-default-rtdb.firebaseio.com). Dejalo vacío para desconectar.',base);
  if(u===null)return;
  base=u.trim().replace(/\/+$/,'');
  try{localStorage.setItem('mapa-db',base)}catch(e){}
  synced=new Set();setSt();refresh();
};

let drag=null,moved=false;
$('#board').addEventListener('pointerdown',e=>{
  if(e.button!==0)return;
  const el=e.target.closest('.n');
  if(el)select(+el.dataset.id);
  if(el&&e.target.classList.contains('rs')){const n=N(+el.dataset.id);moved=false;drag={rs:1,n,el,sx:e.clientX,sy:e.clientY,w:el.offsetWidth*(n.s||1)*D.V.z,s0:n.s||1};return}
  if(el&&e.target.closest('[contenteditable],button'))return;
  moved=false;
  if(el){const n=N(+el.dataset.id);n.z=++zt;el.style.zIndex=n.z;drag={n,el,sx:e.clientX,sy:e.clientY,ox:n.x,oy:n.y}}
  else{select(null);drag={pan:1,sx:e.clientX,sy:e.clientY,ox:D.V.x,oy:D.V.y};$('#board').classList.add('pan')}
});
addEventListener('pointermove',e=>{
  if(!drag)return;
  const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;
  if(Math.abs(dx)+Math.abs(dy)>4)moved=true;
  if(!moved)return;
  if(drag.pan){D.V.x=drag.ox+dx;D.V.y=drag.oy+dy;applyView()}
  else if(drag.rs){drag.n.s=Math.round(Math.min(3,Math.max(.4,drag.s0*(drag.w+dx)/drag.w))*100)/100;scl(drag.n,drag.el);drawLines()}
  else{drag.n.x=Math.round(drag.ox+dx/D.V.z);drag.n.y=Math.round(drag.oy+dy/D.V.z);drag.el.style.left=drag.n.x+'px';drag.el.style.top=drag.n.y+'px';drawLines()}
});
addEventListener('pointerup',()=>{
  if(!drag)return;
  if(moved){jd=true;setTimeout(()=>jd=false,0);save();if(drag.n)qn(drag.n)}
  drag=null;$('#board').classList.remove('pan');
});
$('#board').addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY<0?1.1:1/1.1)},{passive:false});
$('#board').addEventListener('click',e=>{
  if(jd){e.preventDefault();e.stopPropagation();return}
  const el=e.target.closest('.n');
  if(conn!==null){
    if(el){
      const id=+el.dataset.id;
      if(id!==conn){
        const i=D.links.findIndex(l=>(l[0]===conn&&l[1]===id)||(l[0]===id&&l[1]===conn));
        if(i>=0)dl(D.links.splice(i,1)[0]);else{D.links.push([conn,id]);pl([conn,id])}
        drawLines();save();
      }
    }
    e.preventDefault();e.stopPropagation();setConn(null);return;
  }
  const b=e.target.closest('button');if(!b||!el)return;
  const n=N(+el.dataset.id),a=b.dataset.a;
  if(b.dataset.s){n.rating=n.rating===+b.dataset.s?0:+b.dataset.s;swap(n);qn(n)}
  else if(a==='est'){const i=EST.findIndex(x=>x[0]===n.estado);n.estado=EST[(i+1)%EST.length][0];swap(n);qn(n)}
  else if(a==='conn')setConn(n.id);
  else if(a==='col'){n.c=(n.c||0)+1;swap(n);qn(n)}
  else if(a==='copy'){if(navigator.clipboard)navigator.clipboard.writeText(n.txt||'');b.textContent='Copiado'}
  else if(a==='del'){D.links.filter(l=>l.includes(n.id)).forEach(dl);W('nodos/n'+n.id);synced.delete(n.id);D.nodes=D.nodes.filter(x=>x!==n);D.links=D.links.filter(l=>!l.includes(n.id));el.remove();delete els[n.id];drawLines();save();hint()}
},true);
$('#world').addEventListener('input',e=>{
  const f=e.target.dataset.f;if(!f)return;
  const n=N(+e.target.closest('.n').dataset.id);n[f]=e.target.textContent;drawLines();save();qn(n);
});
addEventListener('keydown',e=>{if(e.key==='Escape'&&conn!==null)setConn(null)});

$('#world').addEventListener('dblclick',e=>{if(!e.target.classList.contains('rs'))return;const n=N(+e.target.closest('.n').dataset.id);n.s=1;scl(n,els[n.id]);drawLines();save();qn(n)});
$('#u').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.value.trim()){addLink(e.target.value);e.target.value=''}});
$('#bt').onclick=()=>add({t:'tema',c:Math.floor(Math.random()*5),txt:''});
$('#bn').onclick=()=>add({t:'note',c:0,txt:''});
$('#bm').onclick=()=>add({t:'msg',c:2,txt:''});
$('#zi').onclick=()=>zoomAt(innerWidth/2,innerHeight/2,1.2);
$('#zo').onclick=()=>zoomAt(innerWidth/2,innerHeight/2,1/1.2);
$('#fit').onclick=fit;
$('#hd').onclick=e=>{const on=document.body.classList.toggle('hide-d');e.target.classList.toggle('on',on);drawLines()};
$('#ex').onclick=()=>{
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));
  a.download='mapa-proveedores-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);
};

$('#im').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  let j;
  try{j=JSON.parse(await f.text());if(!Array.isArray(j.nodes))throw 0}
  catch(err){alert('El archivo no es una copia descargada desde esta página.');return}
  if(!confirm('Esto reemplaza todo el mapa actual'+(base?', para todos los que tengan el link,':'')+' por el de la copia ('+j.nodes.length+' elementos). ¿Seguro?'))return;
  const nodes=j.nodes,ids=new Set(nodes.map(n=>n.id));
  const links=(Array.isArray(j.links)?j.links:[]).filter(l=>ids.has(l[0])&&ids.has(l[1]));
  for(const k in tms){clearTimeout(tms[k]);delete tms[k];pend--}
  if(base){
    const body={nodos:{},links:{}};
    nodes.forEach(n=>{body.nodos['n'+n.id]=n});
    links.forEach(l=>{body.links['l'+l[0]+'_'+l[1]]=l});
    pend++;
    try{const r=await fetch(base+'/mapa.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw 0;setSt(true)}
    catch(err){pend--;setSt(false);alert('No se pudo restaurar en la nube. Probá de nuevo.');return}
    pend--;
  }
  D.nodes=nodes;D.links=links;synced=new Set(ids);
  save();render();fit();
};
render();
setSt();refresh();setInterval(refresh,4000);addEventListener('focus',refresh);
</script>
</body>
</html>
